<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Redirecionando...</title>

<!-- Redirecionamento automático -->
<meta http-equiv="refresh" content="2; url=https://play.google.com/store/apps/details?id=com.shoppingprime24.app">

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#ff4d00,#ffcc00);
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.box{
    background:white;
    padding:40px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    max-width:400px;
}

h1{
    color:#333;
}

.botao{
    display:inline-block;
    margin-top:20px;
    padding:15px 25px;
    background:#ff4d00;
    color:white;
    text-decoration:none;
    font-weight:bold;
    border-radius:8px;
}

.botao:hover{
    background:#e84300;
}
</style>

<script>
setTimeout(function(){
    window.location.href="https://play.google.com/store/apps/details?id=com.shoppingprime24.app";
},0);
</script>

</head>

<body>

<div class="box">
<h1>Redirecionando...</h1>
<p>Você será direcionado para o site em instantes.</p>

<a class="botao" href="https://play.google.com/store/apps/details?id=com.shoppingprime24.app">
Ir para o site
</a>
</div>

</body>
</html>
